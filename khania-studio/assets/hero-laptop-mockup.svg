<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FEF08A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="laptop-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Background Environment -->
  <rect width="960" height="540" fill="url(#bg-grad)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="480" cy="240" r="220" fill="#D4AF37" opacity="0.08" filter="blur(40px)" />

  <!-- Laptop Presentation Mockup Frame -->
  <g transform="translate(140, 40)">
    <!-- Laptop Lid Outer Outer Shadow -->
    <rect x="35" y="15" width="610" height="390" rx="16" fill="#000000" opacity="0.4"/>
    
    <!-- Laptop Screen Bezel -->
    <rect x="40" y="20" width="600" height="380" rx="14" fill="url(#laptop-body)" stroke="#475569" stroke-width="2"/>
    <rect x="42" y="22" width="596" height="376" rx="12" fill="#090D16"/>
    
    <!-- Camera Dot -->
    <circle cx="340" cy="32" r="3" fill="#334155"/>
    
    <!-- Laptop Screen Inner Drop Zone Area (16:9 Screen) -->
    <g id="screen-drop-zone">
      <rect x="52" y="44" width="576" height="332" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Placeholder Screen Grid Layout (Neutral Illustrative Display Zone) -->
      <rect x="52" y="44" width="576" height="32" fill="#1E293B"/>
      <!-- Header bar inside screen -->
      <circle cx="72" cy="60" r="4" fill="#EF4444"/>
      <circle cx="86" cy="60" r="4" fill="#F59E0B"/>
      <circle cx="100" cy="60" r="4" fill="#10B981"/>
      <rect x="120" y="54" width="120" height="12" rx="6" fill="#334155"/>
      <rect x="540" y="52" width="70" height="16" rx="4" fill="#D4AF37"/>

      <!-- Screen Preview Hero Section -->
      <rect x="76" y="96" width="280" height="20" rx="4" fill="#FFFFFF"/>
      <rect x="76" y="124" width="200" height="12" rx="3" fill="#94A3B8"/>
      <rect x="76" y="144" width="300" height="10" rx="3" fill="#64748B"/>
      <rect x="76" y="168" width="100" height="24" rx="4" fill="#D4AF37"/>

      <!-- Screen Portfolio Preview Mock Box -->
      <rect x="396" y="96" width="210" height="130" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <path d="M410 200 L450 140 L490 180 L520 150 L590 200 Z" fill="#334155" opacity="0.6"/>
      <circle cx="440" cy="130" r="12" fill="#D4AF37" opacity="0.7"/>

      <!-- Features Cards inside screen -->
      <rect x="76" y="210" width="160" height="140" rx="6" fill="#1E293B"/>
      <rect x="252" y="210" width="160" height="140" rx="6" fill="#1E293B"/>
      <rect x="428" y="210" width="160" height="140" rx="6" fill="#1E293B"/>
      
      <!-- Label overlay for authentic screenshot drop zone -->
      <rect x="160" y="320" width="360" height="32" rx="6" fill="#0F172A" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="340" y="341" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#D4AF37" text-anchor="middle">AUTHENTIC SCREENSHOT DROP ZONE</text>
    </g>

    <!-- Laptop Base / Hinge & Keyboard lip -->
    <path d="M0 400 L680 400 L650 416 L30 416 Z" fill="url(#laptop-body)"/>
    <rect x="280" y="400" width="120" height="6" fill="#475569" rx="2"/>
    <path d="M-40 416 L720 416 C720 422 710 426 690 426 L-10 426 C-30 426 -40 422 -40 416 Z" fill="#1E293B"/>
    <line x1="0" y1="416" x2="680" y2="416" stroke="url(#gold-accent)" stroke-width="2"/>
  </g>
</svg>
